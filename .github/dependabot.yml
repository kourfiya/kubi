version: 2
updates:
  # Outils de dev (html-validate, jsdom, acorn) : une seule PR groupée par mois.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  # Actions GitHub (checkout, setup-node, pages…) : une seule PR groupée par mois.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }
